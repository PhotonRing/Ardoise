name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Assembler ardoise.html
        run: node build.mjs
      - name: Vérifier le fichier assemblé
        run: node scripts/check.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ardoise-html
          path: dist/ardoise.html
      - uses: actions/upload-artifact@v4
        with:
          name: ardoise-obsidian
          path: dist/obsidian/
