name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemblage et vérifications (npm run check)
        run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: ardoise-html
          path: dist/ardoise.html
