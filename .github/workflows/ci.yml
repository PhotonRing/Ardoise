name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # police mathématique (table MATH) : sans elle, Chromium n'étire pas les délimiteurs (\left( du banc formules-office) ;
      # Noto Sans Math 3.000 (celle d'Arch) : celle d'Ubuntu (fonts-noto-core) est plus ancienne et n'étire pas non plus
      - name: Police mathématique
        run: |
          curl -sSL -o /tmp/math.zip https://github.com/notofonts/math/releases/download/NotoSansMath-v3.000/NotoSansMath-v3.000.zip
          echo "ac351837b41f8a897f020b97fb0f075ad574c1e9669fb5839ada1f92fd748356  /tmp/math.zip" | sha256sum -c -
          mkdir -p ~/.local/share/fonts
          unzip -j -o /tmp/math.zip 'NotoSansMath/hinted/ttf/NotoSansMath-Regular.ttf' -d ~/.local/share/fonts
          fc-cache -f ~/.local/share/fonts
          fc-list | grep -i 'sans math'
      - name: Assemblage et vérifications (npm run check)
        run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: ardoise-html
          path: dist/ardoise.html
