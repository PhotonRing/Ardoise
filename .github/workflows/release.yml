name: Release

# À chaque push sur main : assemble dist/ardoise.html, puis, si la version de package.json
# n'a pas encore de tag, crée le tag vX.Y.Z et la release GitHub avec ardoise.html et le plugin Obsidian (zip) en pièces jointes.
# Lancé à la main avec un tag (ex. v1.3.0) : reconstruit ce tag et remplace les fichiers joints de sa release.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Republier les fichiers d'une release existante (ex. v1.3.0) ; laisser vide pour une release normale"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Assembler ardoise.html
        run: node build.mjs

      - name: Vérifier le fichier assemblé
        run: node scripts/check.mjs

      - name: Lire la version
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Préparer le zip du plugin Obsidian
        run: (cd dist/obsidian && zip -q ../ardoise-obsidian.zip main.js manifest.json styles.css)

      - name: Republier les fichiers de la release ${{ inputs.tag }}
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" dist/ardoise.html dist/ardoise-obsidian.zip --clobber
          # retire les autres fichiers joints (anciennes versions qui joignaient aussi le contenu du zip)
          gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r name; do
            case "$name" in ardoise.html|ardoise-obsidian.zip) ;; *) gh release delete-asset "$TAG" "$name" --yes && echo "Retiré : $name" ;; esac
          done

      - name: Créer le tag et la release si la version est nouvelle
        if: inputs.tag == ''
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Le tag $TAG existe déjà : pas de nouvelle release (augmentez la version dans package.json)."
            exit 0
          fi
          gh release create "$TAG" dist/ardoise.html dist/ardoise-obsidian.zip \
            --target "$GITHUB_SHA" \
            --title "Ardoise $TAG" \
            --generate-notes

          # Dernière version lisible depuis une page (raw.githubusercontent.com) : Fichier → Mettre à jour Ardoise
          latest="$RUNNER_TEMP/latest"
          mkdir -p "$latest" && cp dist/ardoise.html "$latest/"
          git -C "$latest" init -q -b latest
          git -C "$latest" add ardoise.html
          git -C "$latest" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Ardoise $TAG"
          git -C "$latest" push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" latest
          echo "created=true" >> "$GITHUB_OUTPUT"

      # Après une release : supprime les branches dont la pull request a été fusionnée dans main.
      # Les fusions se font en squash (git ne voit pas ces branches comme fusionnées) : on part donc des
      # pull requests fusionnées, et une branche n'est supprimée que si elle n'a pas bougé depuis la fusion.
      - name: Supprimer les branches fusionnées
        if: steps.release.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr list --state merged --base main --limit 300 --json headRefName,headRefOid,isCrossRepository \
            --jq '.[] | select(.isCrossRepository | not) | "\(.headRefName) \(.headRefOid)"' | sort -u |
          while read -r branch sha; do
            case "$branch" in main|latest) continue ;; esac
            head=$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq .object.sha 2>/dev/null) || continue
            if [ "$head" = "$sha" ]; then
              gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$branch" && echo "Supprimée : $branch"
            else
              echo "Conservée (nouveaux commits depuis la fusion) : $branch"
            fi
          done
